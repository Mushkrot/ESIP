<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESIP Companion Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef3f0;
    }
    iframe {
      box-sizing: content-box;
      width: 320px;
      height: 720px;
      border: 1px solid #c9d4cf;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(28 45 38 / 16%);
    }
  </style>
</head>
<body>
  <iframe src="index.html" title="ESIP ticket intelligence companion"></iframe>
</body>
</html>
